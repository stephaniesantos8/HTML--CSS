<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desafio 13 Tabelas</title>
    <style>
        table {
            width: 400px;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }

        td,
        th {
            border: 1px solid black;
            width: 70px;
            text-align: center;
            vertical-align: middle;
        }

        thead {
            background-color: lightblue;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Desafio 13 - Tabelas</h1>

    <table>

        <thead>
            <tr>
                <th>A</th>
                <th>B</th>
                <th>C</th>
                <th>D</th>
            </tr>
        </thead>

<tbody>
  <tr>
    <td>1</td>
    <td>2</td>
    <td rowspan="2">3</td>
    <td>4</td>
  </tr>

  <tr>
    <td>5</td>
    <td>6</td>
    <td>7</td>
  </tr>

  <tr>
    <td></td>
    <td colspan="2">8</td>
    <td>9</td>
  </tr>

  <tr>
    <td rowspan="2">10</td>
    <td colspan="2">11</td>
    <td>12</td>
  </tr>

  <tr>
    <td>13</td>
    <td>14</td>
    <td>15</td>
  </tr>
</tbody>

          
</body>

</html>
