<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <label for="in1" >Numero 1</label>
        <input type="number" name="n1" id="in1" min="0" max="100" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)"> <br><br>
        

        <label for="in2" >Numero 2</label>
        <input type="number" name="n2" id="in2" min="0" max="100" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)"> <br><br>
       

        <p>
        <label for="isoma">Soma</label>
            <output name="soma" id="isoma">0</output>
        </p>
<p>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
</p>



    </form>
</body>
</html>
