<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>
    <h1>Exemplo de Formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" value="masculino" id="imasculino">
            <label for="masculino">Masculino</label>
            <br>
            <input type="radio" name="sexo" value="feminino" id="ifeminino">
            <label for="feminino">Feminino</label>
            <br>
        </fieldset>

        <fieldset>
            <legend>Esportes Favoritos</legend>

            <input type="checkbox" name="esportes" value="futebol" id="ifutebol">
            <label for="futebol">Futebol</label>
            <br>
            <input type="checkbox" name="esportes" value="volei" id="ivolei">
            <label for="volei">Volei</label>
            <br>
            <input type="checkbox" name="esportes" value="basquete" id="ibasquete">
            <label for="basquete">Basquete</label>
            <br>
            <input type="checkbox" name="esportes" value="tenis" id="itenis">
            <label for="tenis">Tenis</label>
            <br>
            <input type="checkbox" name="esportes" value="natacao" id="inatacao">
            <label for="natacao">Natação</label>


        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>

</html>
