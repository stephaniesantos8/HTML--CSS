<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>
    <h1>Exemplo de Formulario</h1>

    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>

            <legend>Informações Pessoais</legend>

            <p><label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" autocomplete="name" required>
            </p>

            <p>
                <label for="imail">Email</label>
                <input type="email" name="email" id="imail" autocomplete="email" required>
            </p>

            <p><label for="itel">Telefone</label>
                <input type="tel" name="telefone" id="itel" autocomplete="tel" placeholder="(xx)xxxxx-xxxx" required pattern="\(\d{2}\)\d{5}-\d{4}" >
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>


    </form>
</body>

</html>
