<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        .container {
            display: flex;
            flex-flow: row nowrap;
            background-color: lightgreen;
        }

        .item {
            background-color: lightblue;
            border: 1px solid blue;
            text-align: center;
           

        }

        div#caixa-a {
            /*flex-shrink: 0;
            flex-grow: 1;
            flex-basis: 200px;*/

            flex : 1 0 200px;
        }

        div#caixa-b {
           /* flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 150px;*/
            flex: 1 1 150px;
        }   

        div#caixa-c {
           /* flex-shrink: 8;
            flex-grow: 1;
            flex-basis:auto;*/
                flex: 8 1 auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item" id="caixa-a">A</div>
        <div class="item" id="caixa-b">B</div>
        <div class="item" id="caixa-c">C</div>

    </div>
</body>

</html>
