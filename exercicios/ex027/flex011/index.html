<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        .container {
            display: flex;
            flex-flow: row nowrap;
            background-color: lightgreen;
        }

        .item {
            background-color: lightblue;
            border: 1px solid blue;
            text-align: center;
            flex-basis: 200px;

        }

        div#caixa-a {
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#caixa-b {
            flex-shrink: 1;
            flex-grow: 2;
        }

        div#caixa-c {
            flex-shrink: 1;
            flex-grow: 4;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item" id="caixa-a">A</div>
        <div class="item" id="caixa-b">B</div>
        <div class="item" id="caixa-c">C</div>

    </div>
</body>

</html>
