<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: lightcoral;

        }

        main {
            width: 90vw;
            height: 90vh;
            background-color: lightgreen;                                                                display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;

        }

        section {
            width: 200px;
            height: 200px;
            background-color: lightblue;

        }
    </style>
</head>

<body>
    <main>
        <section>
            <h1>Tela de Login</h1>
        </section>
    </main>
</body>

</html>
